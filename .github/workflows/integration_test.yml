name: Integration Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drive_android:
    name: Android API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        # One API level per behavioral region of the Android backend:
        # 24 is the plugin's floor and decodes with BitmapFactory; 28 is the
        # first level that decodes with ImageDecoder; 30 is the first that
        # selects the explicit WEBP_LOSSY/WEBP_LOSSLESS compress formats; 36
        # covers current devices. All four have a `default;x86_64` system image.
        api-level: [24, 28, 30, 36]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: koji-1009/setup-flutter@9a42a50501f6af795c1a42e2c3c371f40e8c54b2 # v1.4.0
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          script: flutter test integration_test/app_test.dart -d android
          working-directory: example

  drive_ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: koji-1009/setup-flutter@9a42a50501f6af795c1a42e2c3c371f40e8c54b2 # v1.4.0
      - uses: koji-1009/boot-simctl@75139bcbd39bf667f1cb4b6742a0b929676efc3b # v1.1.0
        with:
          device: iPhone
          os: "26"
      - name: Pre-build the app
        working-directory: example
        run: flutter build ios --simulator --target=integration_test/app_test.dart
      - name: Run flutter integration tests
        working-directory: example
        run: flutter test integration_test/app_test.dart -d "$SIMULATOR_UDID"

  drive_macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: koji-1009/setup-flutter@9a42a50501f6af795c1a42e2c3c371f40e8c54b2 # v1.4.0
      - name: Run Flutter Integration tests
        working-directory: example
        run: flutter test integration_test/app_test.dart -d macos

  drive_windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: koji-1009/setup-flutter@9a42a50501f6af795c1a42e2c3c371f40e8c54b2 # v1.4.0
      - name: Run Flutter Integration tests
        working-directory: example
        run: flutter test integration_test/app_test.dart -d windows

  drive_linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GTK build deps for the Linux desktop runner; libgtk-3-dev pulls in
      # GdkPixbuf with its built-in JPEG/PNG loaders. The WebP/HEIF loaders are
      # intentionally not installed, so the WebP path exercises the
      # codecUnavailable branch. xvfb provides a headless display.
      - name: Install Linux build and GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - uses: koji-1009/setup-flutter@9a42a50501f6af795c1a42e2c3c371f40e8c54b2 # v1.4.0
      - name: Run Flutter Integration tests
        working-directory: example
        run: xvfb-run -a flutter test integration_test/app_test.dart -d linux

  drive_web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: koji-1009/setup-flutter@9a42a50501f6af795c1a42e2c3c371f40e8c54b2 # v1.4.0
      - name: Setup chromedriver
        run: |
          npx @puppeteer/browsers install chromedriver@stable
          chromedriver --port=4444 &
      - name: Run Flutter Integration tests
        working-directory: example
        run: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d web-server
